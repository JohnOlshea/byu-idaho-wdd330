<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>
  <body>
    <header class="divider" id="main-header"></header>
    <main class="divider">
      <section class="products">
        <h2>Review &amp; Place your Order</h2>
      </section>

      <section class="checkout-form">
        <form name="checkout">
          <fieldset>
            <legend>Customer Name</legend>
            <label for="fname">First Name</label>
            <input name="fname" id="fname" required />

            <label for="lname">Last Name</label>
            <input name="lname" id="lname" required />
          </fieldset>

          <fieldset>
            <legend>Address</legend>
            <label for="street">Street Address</label>
            <input name="street" id="street" required />

            <label for="city">City</label>
            <input name="city" id="city" required />

            <label for="state">State</label>
            <input
              name="state"
              id="state"
              required
              pattern="[A-Za-z]{2}"
              maxlength="2"
              title="2-letter state code, e.g. ID"
            />

            <label for="zip">Zip Code</label>
            <input
              name="zip"
              id="zip"
              required
              pattern="[0-9]{5}"
              title="Please enter a 5-digit zip code"
            />
          </fieldset>

          <fieldset>
            <legend>Payment</legend>
            <label for="cardNumber">Credit Card Number</label>
            <input
              name="cardNumber"
              id="cardNumber"
              required
              pattern="[0-9]{16}"
              title="Enter 16-digit card number without spaces"
              value="1234123412341234"
            />

            <label for="expiration">Expiration Date</label>
            <input
              name="expiration"
              id="expiration"
              required
              pattern="(0[1-9]|1[0-2])\/[0-9]{2}"
              placeholder="MM/YY"
              title="MM/YY, e.g. 12/28"
              value="12/28"
            />

            <label for="code">Security Code</label>
            <input
              name="code"
              id="code"
              required
              pattern="[0-9]{3}"
              title="3-digit security code"
              value="123"
            />
          </fieldset>

          <button type="submit" id="checkoutSubmit">Checkout</button>
        </form>
      </section>

      <section class="order-summary">
        <h3>Order Summary</h3>
        <p>Items: <span id="num-items"></span></p>
        <p>Subtotal: <span id="subtotal"></span></p>
        <p>Tax: <span id="tax"></span></p>
        <p>Shipping: <span id="shipping"></span></p>
        <p><strong>Order Total: <span id="orderTotal"></span></strong></p>
      </section>
    </main>
    <footer id="main-footer"></footer>
  </body>
</html>
